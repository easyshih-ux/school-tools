<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>義學 LINE 查詢</title>

  <!-- PWA & Mobile Home Screen Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#02773c">

  <!-- Apple iOS Safari Home Screen Support -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LINE查詢">

  <!-- Android / Standard Favicon -->
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #appContainer {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #gasFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      z-index: 1;
    }

    /* Minimal lightweight loading indicator */
    #loadingOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      z-index: 2;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #loadingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(2, 119, 60, 0.15);
      border-top-color: #02773c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    .loading-text {
      color: #64748b;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="appContainer">
    <!-- Minimal Loading Overlay -->
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">載入義學 LINE 查詢中...</div>
    </div>

    <!-- Google Apps Script Full-screen iframe -->
    <iframe
      id="gasFrame"
      src="https://script.google.com/macros/s/AKfycbwcHwFkSb239BVfykNQ9Am9EGHj9NNymbCNtUaXR_Pz2_BdIguJFkyOhLEQV0NgOHUZAA/exec"
      allow="clipboard-read; clipboard-write; fullscreen"
      onload="hideLoading()"
    ></iframe>
  </div>

  <script>
    function hideLoading() {
      var loader = document.getElementById('loadingOverlay');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(function() {
          loader.style.display = 'none';
        }, 350);
      }
    }

    // Safety fallback: if iframe onload doesn't fire within 6 seconds, hide overlay
    setTimeout(hideLoading, 6000);
  </script>
</body>
</html>
