name: Deploy production to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static production artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css device-session-store.js api-client.js config.js app.js pwa.js sw.js manifest.webmanifest _site/
          cp -R icons _site/icons

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy production
        uses: actions/deploy-pages@v4
